# Manual, isolated deployment. Never updates the existing 'zenifield' Worker or the demo Supabase project.
name: zenifield-live-deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zenifield-live-deploy
  cancel-in-progress: false
jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: live
    env:
      CLOUDFLARE_ACCOUNT_ID: d50191f54ac6859d1ecedddf26094351
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LIVE_API_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ZENIFIELD_LIVE_GATEWAY_TOKEN: ${{ secrets.ZENIFIELD_LIVE_GATEWAY_TOKEN }}
      LIVE_SUPABASE_REF: cyrsdaqqnegrynhwurnb
      LIVE_URL: https://zenifield-live.jobsky.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated live credentials and target
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN SUPABASE_ACCESS_TOKEN ZENIFIELD_LIVE_GATEWAY_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::$v is missing in the live environment"; exit 1; fi
          done
          node --input-type=module -e "import {readFileSync} from 'node:fs';let x=JSON.parse(readFileSync('ops/db-targets.json'));if(x.active!=='demo'||x.targets.demo.ref!=='nhywssfwtnonytbkufyy'||x.targets.real.ref!=='cyrsdaqqnegrynhwurnb')process.exit(1)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and isolate live Worker
        env:
          NO_BUMP: '1'
          ZENIFIELD_DEPLOY_TARGET: cloudflare
        run: |
          pnpm build
          node scripts/prepare-cloudflare-deploy.mjs
          node scripts/prepare-cloudflare-live-deploy.mjs
      - name: Match live Edge authentication hash
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(printf '%s' "$ZENIFIELD_LIVE_GATEWAY_TOKEN" | sha256sum | cut -d ' ' -f 1)"
          npx supabase secrets set "ZENIFIELD_LIVE_GATEWAY_TOKEN_HASH=$HASH" "ZENIFIELD_LIVE_CLOUDFLARE_TOKEN_HASH=$HASH" --project-ref "$LIVE_SUPABASE_REF"
      - name: Deploy only zenifield-live Worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.151.0 deploy --config dist/server/wrangler.live.json --message "Live build $GITHUB_SHA"
          printf '%s' "https://$LIVE_SUPABASE_REF.supabase.co" | pnpm dlx wrangler@4.151.0 secret put ZENIFIELD_SUPABASE_URL --name zenifield-live
          printf '%s' "$ZENIFIELD_LIVE_GATEWAY_TOKEN" | pnpm dlx wrangler@4.151.0 secret put ZENIFIELD_GATEWAY_TOKEN --name zenifield-live
      - name: Verify public login and blocked unauthenticated access
        run: node scripts/check-cloudflare-deployment.mjs "$LIVE_URL" "$GITHUB_SHA"
