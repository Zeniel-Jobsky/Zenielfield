# main 검증 → 필요한 경우 이관·Edge → Cloudflare 화면 배포.
# 필요한 secret: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, CLOUDFLARE_API_TOKEN.
name: supabase-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '이관을 적용하지 않고 미적용 목록만 출력'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 백엔드 변경 확인
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
          else
            # 실패하거나 대기 중 취소된 푸시의 백엔드 변경도 다음 배포에 포함한다.
            BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-deploy.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
            echo "Last successful production revision: ${BASE_SHA:-none}"
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
            elif git diff --quiet "$BASE_SHA" HEAD -- supabase/ app/platform/mutations.ts app/platform/model.ts scripts/migrate.mjs scripts/bundle-supabase.mjs; then
              echo 'backend_changed=false' >> "$GITHUB_OUTPUT"
            else
              echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cloudflare 인증 경계 검증
        run: |
          node tests/run-cloudflare-auth.mjs
          node tests/run-cloudflare-supabase.mjs
          node tests/cloudflare-deployment.test.mjs
          node tests/cloudflare-deploy-config.test.mjs
  migrate-and-deploy:
    needs: verify
    if: needs.verify.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 로컬 검증 (타입·플랫폼 테스트)
        run: |
          node_modules/.bin/tsc --noEmit -p .
          node tests/run-platform.mjs
      - name: Supabase 배포 설정 진단
        run: |
          node -e 'const token=process.env.SUPABASE_ACCESS_TOKEN||"";const ref=process.env.SUPABASE_PROJECT_REF||"";console.log(`Access token length: ${token.length}`);console.log(`Project ref matches repository: ${ref==="nhywssfwtnonytbkufyy"}`);if(!token||!ref)process.exit(1)'
      - name: 이관 적용 (미적용 파일만, 파일마다 트랜잭션)
        run: node scripts/migrate.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 검증 로직 번들
        if: ${{ !inputs.dry_run }}
        run: node scripts/bundle-supabase.mjs
      - name: Edge 함수 재배포
        if: ${{ !inputs.dry_run }}
        run: |
          npx supabase functions deploy zenifield-gateway --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase functions deploy zenifield-cloudflare --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: 번들 산출물이 커밋과 다르면 알림
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git diff --quiet -- supabase/functions/zenifield-gateway/logic.js; then
            echo "::warning::logic.js 가 소스와 달랐습니다. 로컬에서 node scripts/bundle-supabase.mjs 를 실행해 커밋하세요."
          fi
  cloudflare-deploy:
    needs: [verify, migrate-and-deploy]
    if: >-
      always() && !cancelled() && !inputs.dry_run &&
      needs.verify.result == 'success' &&
      (needs.migrate-and-deploy.result == 'success' || needs.migrate-and-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      # 회사 Cloudflare 계정으로 고정. Worker 전용 토큰과 wrangler 대상도 함께 검증한다.
      CLOUDFLARE_ACCOUNT_ID: d50191f54ac6859d1ecedddf26094351
      ZENIFIELD_PUBLIC_URL: https://zenifield.jobsky.workers.dev
    steps:
      - name: GitHub 배포 자격증명 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::GitHub Settings → Secrets and variables → Actions에 CLOUDFLARE_API_TOKEN을 등록하세요.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 검증한 커밋을 Cloudflare 대상으로 빌드
        env:
          NO_BUMP: '1'
          ZENIFIELD_DEPLOY_TARGET: cloudflare
        run: pnpm build
      - name: 배포 CLI 호환 설정 생성
        run: node scripts/prepare-cloudflare-deploy.mjs
      - name: zenifield Worker 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Worker 전용 토큰을 지원하는 CLI만 별도 사용해 앱의 기존 빌드 의존성을 유지한다.
        run: pnpm dlx wrangler@4.151.0 deploy --config dist/server/wrangler.ci.json --message "GitHub Actions $GITHUB_SHA"
      - name: 공개 URL 응답 확인
        run: node scripts/check-cloudflare-deployment.mjs "$ZENIFIELD_PUBLIC_URL" "$GITHUB_SHA"
      - name: 배포 기록
        run: |
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $ZENIFIELD_PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
