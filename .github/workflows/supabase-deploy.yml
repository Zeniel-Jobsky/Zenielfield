# main 검증 → 필요한 경우 이관·Edge → Cloudflare 화면 배포.
# 필요한 secret: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, CLOUDFLARE_API_TOKEN.
name: supabase-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '이관을 적용하지 않고 미적용 목록만 출력'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 백엔드 변경 확인
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" HEAD -- supabase/ app/platform/mutations.ts app/platform/model.ts scripts/migrate.mjs scripts/bundle-supabase.mjs; then
            echo 'backend_changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'backend_changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cloudflare 인증 경계 검증
        run: |
          node tests/run-cloudflare-auth.mjs
          node tests/run-cloudflare-supabase.mjs
  migrate-and-deploy:
    needs: verify
    if: needs.verify.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 로컬 검증 (타입·플랫폼 테스트)
        run: |
          node_modules/.bin/tsc --noEmit -p .
          node tests/run-platform.mjs
      - name: 이관 적용 (미적용 파일만, 파일마다 트랜잭션)
        run: node scripts/migrate.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 검증 로직 번들
        if: ${{ !inputs.dry_run }}
        run: node scripts/bundle-supabase.mjs
      - name: Edge 함수 재배포
        if: ${{ !inputs.dry_run }}
        run: |
          npx supabase functions deploy zenifield-gateway --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          npx supabase functions deploy zenifield-cloudflare --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: 번들 산출물이 커밋과 다르면 알림
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git diff --quiet -- supabase/functions/zenifield-gateway/logic.js; then
            echo "::warning::logic.js 가 소스와 달랐습니다. 로컬에서 node scripts/bundle-supabase.mjs 를 실행해 커밋하세요."
          fi
  cloudflare-deploy:
    needs: [verify, migrate-and-deploy]
    if: >-
      always() && !cancelled() && !inputs.dry_run &&
      needs.verify.result == 'success' &&
      (needs.migrate-and-deploy.result == 'success' || needs.migrate-and-deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 검증한 커밋을 Cloudflare 대상으로 빌드
        env:
          NO_BUMP: '1'
          ZENIFIELD_DEPLOY_TARGET: cloudflare
        run: pnpm build
      - name: zenifield Worker 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Worker 전용 토큰을 지원하는 CLI만 별도 사용해 앱의 기존 빌드 의존성을 유지한다.
        run: pnpm dlx wrangler@4.151.0 deploy --config dist/server/wrangler.json --message "GitHub Actions $GITHUB_SHA"
      - name: 공개 URL 응답 확인
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --output /dev/null 'https://zenifield.ugen-kwon.workers.dev/?mode=demo'
      - name: 배포 기록
        run: |
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'URL: https://zenifield.ugen-kwon.workers.dev' >> "$GITHUB_STEP_SUMMARY"
